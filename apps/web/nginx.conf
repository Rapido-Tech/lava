server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Backend lives in the "lava-api" service on the same compose network
    # (named uniquely because Dokploy shares one Docker network across all
    # stacks — a generic "api" alias would collide with other projects)
    location /api/ {
        proxy_pass http://lava-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all routes serve index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
